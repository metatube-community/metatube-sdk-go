name: Clean Up GHCR Images

concurrency:
  group: ghcr-cleanup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: metatube-server
          delete-untagged: true
          older-than: 30 days
          validate: true
          dry-run: true
