name: Bug report
description: Report something that is not working
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What went wrong? Include the error message if there is one.
    validations:
      required: true

  - type: input
    id: reproduce
    attributes:
      label: Provider and movie ID
      placeholder: e.g., FANZA / ABC-123
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` shown at the server's root URL, or the output of `-version`.
