openapi: 3.1.1
info:
  title: MetaTube API
  description: HTTP API served by `cmd/server`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: v1
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      tags: [System]
      operationId: getIndex
      summary: Get the app name and version
      description: With `redirect`, redirects to the actor or movie homepage instead.
      parameters:
        - name: redirect
          in: query
          description: '`provider:id` pair; a trailing position suffix is ignored.'
          schema:
            type: string
          example: FANZA:ssis00001
      responses:
        '200':
          description: App info.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [app, version]
                    properties:
                      app:
                        type: string
                        examples: [metatube]
                      version:
                        type: string
        '307':
          description: Redirect to the actor or movie homepage.
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /v1/modules:
    get:
      tags: [System]
      operationId: getModules
      summary: List the Go modules the server was built with
      description: Not wrapped in the `data` envelope.
      responses:
        '200':
          description: Build dependencies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                required: [modules]
                properties:
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/Module'

  /v1/providers:
    get:
      tags: [System]
      operationId: getProviders
      summary: List the registered providers
      responses:
        '200':
          description: Provider names mapped to their base URLs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [actor_providers, movie_providers]
                    properties:
                      actor_providers:
                        type: object
                        additionalProperties:
                          type: string
                      movie_providers:
                        type: object
                        additionalProperties:
                          type: string

  /v1/images/primary/{provider}/{id}:
    get:
      tags: [Images]
      operationId: getPrimaryImage
      summary: Get a primary (poster) image
      description: Crops to 2:3; without `url`, `ratio` and `pos` apply to movies only.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ImageURL'
        - name: ratio
          in: query
          description: Crop aspect ratio (width / height); negative means 2:3.
          schema:
            type: number
            format: double
            default: -1
        - $ref: '#/components/parameters/ImagePosition'
        - $ref: '#/components/parameters/ImageAuto'
        - $ref: '#/components/parameters/ImageBadge'
        - $ref: '#/components/parameters/ImageQuality'
      responses:
        '200':
          $ref: '#/components/responses/Image'
        default:
          $ref: '#/components/responses/Error'

  /v1/images/thumb/{provider}/{id}:
    get:
      tags: [Images]
      operationId: getThumbImage
      summary: Get a thumb image
      description: Crops to 16:9; actor providers require `url`.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ImageURL'
        - $ref: '#/components/parameters/ImagePosition'
        - $ref: '#/components/parameters/ImageAuto'
        - $ref: '#/components/parameters/ImageBadge'
        - $ref: '#/components/parameters/ImageQuality'
      responses:
        '200':
          $ref: '#/components/responses/Image'
        default:
          $ref: '#/components/responses/Error'

  /v1/images/backdrop/{provider}/{id}:
    get:
      tags: [Images]
      operationId: getBackdropImage
      summary: Get a backdrop image
      description: Not cropped; actor providers require `url`.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/ImageURL'
        - $ref: '#/components/parameters/ImageBadge'
        - $ref: '#/components/parameters/ImageQuality'
      responses:
        '200':
          $ref: '#/components/responses/Image'
        default:
          $ref: '#/components/responses/Error'

  /v1/translate:
    get:
      tags: [Translate]
      operationId: translate
      summary: Translate text
      description: Only the selected engine's credential parameters are read.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: Source language.
          schema:
            type: string
            default: auto
        - name: to
          in: query
          required: true
          description: Target language.
          schema:
            type: string
        - name: engine
          in: query
          required: true
          description: Translation engine, matched case-insensitively.
          schema:
            type: string
            enum: [baidu, deepl, google, googlefree, openai]
        - name: baidu-app-id
          in: query
          schema:
            type: string
        - name: baidu-app-key
          in: query
          schema:
            type: string
        - name: deepl-api-key
          in: query
          schema:
            type: string
        - name: deepl-api-url
          in: query
          description: Optional DeepL(X) API URL.
          schema:
            type: string
        - name: google-api-key
          in: query
          schema:
            type: string
        - name: google-api-url
          in: query
          schema:
            type: string
        - name: openai-api-key
          in: query
          schema:
            type: string
        - name: openai-api-url
          in: query
          schema:
            type: string
        - name: openai-model
          in: query
          schema:
            type: string
        - name: openai-prompt
          in: query
          description: System prompt that replaces the built-in one.
          schema:
            type: string
      responses:
        '200':
          description: Translated text.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TranslateResult'
        default:
          $ref: '#/components/responses/Error'

  /v1/db/version:
    get:
      tags: [Database]
      operationId: getDBVersion
      summary: Get the database version
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Database server version.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version]
                    properties:
                      version:
                        type: string
        default:
          $ref: '#/components/responses/Error'

  /v1/actors/{provider}/{id}:
    get:
      tags: [Actors]
      operationId: getActorInfo
      summary: Get actor info
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Lazy'
      responses:
        '200':
          description: Actor info.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ActorInfo'
        default:
          $ref: '#/components/responses/Error'

  /v1/actors/search:
    get:
      tags: [Actors]
      operationId: searchActor
      summary: Search actors
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchProvider'
        - $ref: '#/components/parameters/SearchFallback'
      responses:
        '200':
          description: Non-empty list of results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/ActorSearchResult'
        default:
          $ref: '#/components/responses/Error'

  /v1/movies/{provider}/{id}:
    get:
      tags: [Movies]
      operationId: getMovieInfo
      summary: Get movie info
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Lazy'
      responses:
        '200':
          description: Movie info.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MovieInfo'
        default:
          $ref: '#/components/responses/Error'

  /v1/movies/search:
    get:
      tags: [Movies]
      operationId: searchMovie
      summary: Search movies
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchProvider'
        - $ref: '#/components/parameters/SearchFallback'
      responses:
        '200':
          description: Non-empty list of results.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/MovieSearchResult'
        default:
          $ref: '#/components/responses/Error'

  /v1/reviews/{provider}/{id}:
    get:
      tags: [Reviews]
      operationId: getMovieReviews
      summary: Get movie reviews
      description: '`provider` must be a movie provider; with `homepage`, `id` is ignored.'
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/ID'
        - name: homepage
          in: query
          description: Movie page URL to fetch reviews from.
          schema:
            type: string
        - $ref: '#/components/parameters/Lazy'
      responses:
        '200':
          description: Reviews, or `null` if none.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: [array, 'null']
                    items:
                      $ref: '#/components/schemas/MovieReviewDetail'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when the server is started with a token.

  headers:
    CacheControlNoStore:
      schema:
        type: string
        enum: [no-store]
    CacheControlPublic:
      schema:
        type: string
        enum: ['public, s-maxage=15552000']

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: Provider name, case-insensitive.
      schema:
        type: string
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Lazy:
      name: lazy
      in: query
      description: Read from the database first.
      schema:
        type: boolean
        default: true
    SearchQ:
      name: q
      in: query
      required: true
      description: Keyword, or a URL to fetch as a single result.
      schema:
        type: string
    SearchProvider:
      name: provider
      in: query
      description: Search only this provider instead of all.
      schema:
        type: string
    SearchFallback:
      name: fallback
      in: query
      description: Also include matching results from the database.
      schema:
        type: boolean
        default: true
    ImageURL:
      name: url
      in: query
      description: Image URL to use instead of the default image.
      schema:
        type: string
    ImagePosition:
      name: pos
      in: query
      description: Crop center from 0 to 1; negative means the default.
      schema:
        type: number
        format: double
        default: -1
    ImageAuto:
      name: auto
      in: query
      description: Detect faces to choose the crop position; only applies with `url`.
      schema:
        type: boolean
        default: false
    ImageBadge:
      name: badge
      in: query
      description: URL of a badge image to overlay at the top-left corner.
      schema:
        type: string
    ImageQuality:
      name: quality
      in: query
      description: JPEG quality, clamped to 1-100.
      schema:
        type: integer
        default: 90

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Image:
      description: JPEG image.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlPublic'
        X-MetaTube-Image-Width:
          schema:
            type: integer
        X-MetaTube-Image-Height:
          schema:
            type: integer
      content:
        image/jpeg: {}

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: Same as the HTTP status code.
            message:
              type: string

    Module:
      type: object
      description: Go `debug.Module`; empty fields are omitted.
      properties:
        Path:
          type: string
        Version:
          type: string
        Sum:
          type: string
        Replace:
          $ref: '#/components/schemas/Module'

    TranslateResult:
      type: object
      required: [from, to, translated_text]
      properties:
        from:
          type: string
          description: The `from` query parameter, not the detected language.
        to:
          type: string
        translated_text:
          type: string

    Date:
      type: string
      format: date-time
      description: Midnight UTC; zero time when unknown.
      examples: ['2021-02-19T00:00:00Z']

    StringArray:
      type: [array, 'null']
      items:
        type: string

    ActorSearchResult:
      type: object
      required: [id, name, provider, homepage, images]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        homepage:
          type: string
        aliases:
          $ref: '#/components/schemas/StringArray'
        images:
          $ref: '#/components/schemas/StringArray'

    ActorInfo:
      type: object
      required: [id, name, provider, homepage, summary, hobby, skill, blood_type, cup_size,
        measurements, nationality, height, aliases, images, birthday, debut_date]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        homepage:
          type: string
        summary:
          type: string
        hobby:
          type: string
        skill:
          type: string
        blood_type:
          type: string
        cup_size:
          type: string
        measurements:
          type: string
        nationality:
          type: string
        height:
          type: integer
          description: Centimeters.
        aliases:
          $ref: '#/components/schemas/StringArray'
        images:
          $ref: '#/components/schemas/StringArray'
        birthday:
          $ref: '#/components/schemas/Date'
        debut_date:
          $ref: '#/components/schemas/Date'

    MovieSearchResult:
      type: object
      required: [id, number, title, provider, homepage, thumb_url, cover_url, score, release_date]
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: string
        provider:
          type: string
        homepage:
          type: string
        thumb_url:
          type: string
        cover_url:
          type: string
        score:
          type: number
          format: double
        actors:
          $ref: '#/components/schemas/StringArray'
        release_date:
          $ref: '#/components/schemas/Date'

    MovieInfo:
      type: object
      required: [id, number, title, summary, provider, homepage, director, actors, thumb_url,
        big_thumb_url, cover_url, big_cover_url, preview_video_url, preview_video_hls_url,
        preview_images, maker, label, series, genres, score, runtime, release_date]
      properties:
        id:
          type: string
        number:
          type: string
        title:
          type: string
        summary:
          type: string
        provider:
          type: string
        homepage:
          type: string
        director:
          type: string
        actors:
          $ref: '#/components/schemas/StringArray'
        thumb_url:
          type: string
        big_thumb_url:
          type: string
        cover_url:
          type: string
        big_cover_url:
          type: string
        preview_video_url:
          type: string
        preview_video_hls_url:
          type: string
        preview_images:
          $ref: '#/components/schemas/StringArray'
        maker:
          type: string
        label:
          type: string
        series:
          type: string
        genres:
          $ref: '#/components/schemas/StringArray'
        score:
          type: number
          format: double
        runtime:
          type: integer
          description: Minutes.
        release_date:
          $ref: '#/components/schemas/Date'

    MovieReviewDetail:
      type: object
      required: [title, author, comment, score, date]
      properties:
        title:
          type: string
        author:
          type: string
        comment:
          type: string
        score:
          type: number
          format: double
        date:
          $ref: '#/components/schemas/Date'
